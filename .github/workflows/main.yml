name: Build Club Connect

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  VERSION: "0.9"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: android-arm64,  goos: linux,   goarch: arm64, goarm: "",  tor_bundle: android-aarch64 }
          - { name: android-armv7a, goos: linux,   goarch: arm,   goarm: "7", tor_bundle: android-armv7 }
          - { name: linux-amd64,    goos: linux,   goarch: amd64, goarm: "",  tor_bundle: linux-x86_64 }
          - { name: linux-arm64,    goos: linux,   goarch: arm64, goarm: "",  tor_bundle: "" }
          - { name: windows-amd64,  goos: windows, goarch: amd64, goarm: "",  tor_bundle: windows-x86_64 }
          - { name: windows-x86,    goos: windows, goarch: "386", goarm: "",  tor_bundle: windows-i686 }
          - { name: windows-arm64,  goos: windows, goarch: arm64, goarm: "",  tor_bundle: "" }
          - { name: macos-arm64,    goos: darwin,  goarch: arm64, goarm: "",  tor_bundle: macos-aarch64 }
          - { name: macos-amd64,    goos: darwin,  goarch: amd64, goarm: "",  tor_bundle: macos-x86_64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Resolve dependencies, vet and test
        run: |
          go mod tidy
          go vet ./...
          go test -count=1 ./...

      - name: Build Club Connect
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          EXT=""; [ "$GOOS" = "windows" ] && EXT=".exe"
          mkdir -p pkg
          go build -trimpath -ldflags "-s -w -X main.Version=$VERSION" -o pkg/clubconnect$EXT .

      - name: Build Psiphon tunnel-core (the fork Aether uses)
        # The fork adds the FRONTED-MEEK-CDN-* protocols. A stock tunnel-core rejects a config
        # that names them and exits at once, which showed up as "[psiphon] process exited" forever.
        continue-on-error: true
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          GOFLAGS: -mod=vendor
        run: |
          EXT=""; [ "$GOOS" = "windows" ] && EXT=".exe"
          git -c core.longpaths=true clone --quiet --depth 50 --branch shirokhorshid https://github.com/CluvexStudio/psiphon-tunnel-core.git /tmp/psiphon
          cd /tmp/psiphon
          git checkout --quiet 83aa73b9b982e7421e00117f5b0c5aceb5dda452 2>/dev/null || echo "pinned commit is gone, using the branch head"
          go build -trimpath -ldflags "-s -w" -o "$GITHUB_WORKSPACE/pkg/psiphon-tunnel-core$EXT" ./ConsoleClient

      - name: Build Tor pluggable transports (lyrebird, snowflake)
        continue-on-error: true
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          EXT=""; [ "$GOOS" = "windows" ] && EXT=".exe"
          P=https://gitlab.torproject.org/tpo/anti-censorship/pluggable-transports
          git clone --depth 1 $P/lyrebird.git /tmp/lyrebird
          (cd /tmp/lyrebird && go build -trimpath -ldflags "-s -w" -o "$GITHUB_WORKSPACE/pkg/lyrebird$EXT" ./cmd/lyrebird)
          git clone --depth 1 $P/snowflake.git /tmp/snowflake
          (cd /tmp/snowflake && go build -trimpath -ldflags "-s -w" -o "$GITHUB_WORKSPACE/pkg/snowflake-client$EXT" ./client)

      - name: Add tor (Linux x86_64 from apt)
        if: matrix.name == 'linux-amd64'
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq tor
          cp "$(command -v tor)" pkg/tor

      - name: Add tor (Tor Project expert bundle, other platforms)
        # Uses the newest Tor Browser version unless a repository variable TOR_EXPERT_VERSION
        # (for example 14.5.8) pins one.
        if: matrix.name != 'linux-amd64' && matrix.tor_bundle != ''
        continue-on-error: true
        run: |
          V="${{ vars.TOR_EXPERT_VERSION }}"
          if [ -z "$V" ]; then
            V=$(curl -fsSL https://aus1.torproject.org/torbrowser/update_3/release/downloads.json | python3 -c 'import sys,json; print(json.load(sys.stdin)["version"])')
          fi
          echo "tor expert bundle version: $V"
          curl -fsSL -o /tmp/tor.tgz "https://archive.torproject.org/tor-package-archive/torbrowser/$V/tor-expert-bundle-${{ matrix.tor_bundle }}-$V.tar.gz"
          mkdir -p /tmp/torb && tar -xzf /tmp/tor.tgz -C /tmp/torb
          find /tmp/torb -type f \( -name 'tor' -o -name 'tor.exe' -o -name '*.dll' \) -exec cp {} pkg/ \;

      - name: Package
        run: |
          cp config.example.json README.md pkg/
          D=clubconnect-v$VERSION-${{ matrix.name }}
          mv pkg "$D"
          zip -qr "$D.zip" "$D"
          ls -la "$D"

      - uses: actions/upload-artifact@v4
        with:
          name: clubconnect-${{ matrix.name }}
          path: clubconnect-v*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: clubconnect-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: clubconnect-v*.zip
